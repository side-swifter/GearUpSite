<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Site images (kept for site content) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <meta name="theme-color" content="#ede8db" />
    <title>Gear Up Foundation</title>
  </head>
  <body>
    <!-- Hidden static form so Netlify can detect the form at build time -->
    <form
      name="class-signup"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="studentName" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="grade" />
      <input type="text" name="timeslot" />
      <input type="text" name="interests" />
      <input type="text" name="message" />
      <input type="text" name="className" />
      <input type="text" name="bot-field" />
    </form>

    <!-- Hidden static contact form for Netlify detection -->
    <form
      name="contact-form"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <input type="text" name="message" />
      <input type="text" name="bot-field" />
    </form>

    <!-- Hidden static hackathon interest form for Netlify detection -->
    <form
      name="hackathon-interest"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <input type="text" name="role" />
      <input type="text" name="roleLabel" />
      <input type="text" name="message" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
